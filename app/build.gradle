plugins {
    id 'com.android.application'
}

// QuickJS 源码位置（由 tools/setup_quickjs.sh 下载）
def qjsDir = file('../third_party/quickjs-wrapper')
if (!new File(qjsDir, 'native/quickjs/quickjs.c').exists()) {
    throw new GradleException("缺少 QuickJS 源码：请先在 haplayer-lx 目录执行  bash tools/setup_quickjs.sh")
}

android {
    namespace 'com.mcool.player'
    compileSdk 34
    // NDK r25c：最后一个支持 minSdk 19 的 NDK（r26 起最低 21）
    ndkVersion "25.2.9519653"

    defaultConfig {
        // 与原 player-final（com.mcool.player）区分，两个可以同时装在车机上
        applicationId "com.mcool.player.lx"
        minSdk 19
        targetSdk 34
        versionCode 6
        versionName "3.0-carplay"

        multiDexEnabled true

        ndk {
            // 车机是 32 位 ARM，只打这一种，编译也快
            abiFilters 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                // 给 QuickJS 的 C 代码补上 Android 4.4 没有的 fesetround/fegetround
                // C 和 C++ 都强制引入，避免调用点在 .cpp 一侧时漏掉
                String compat = "-include " + file('src/main/cpp/fenv_compat.h').absolutePath
                cFlags compat
                cppFlags '-DIS_ANDROID=TRUE', compat
                arguments '-DANDROID_STL=c++_static'
            }
        }

        renderscriptTargetApi 19
        renderscriptSupportModeEnabled true
    }

    // 直接用 quickjs-wrapper 自带的 CMakeLists 编译出 libquickjs-android-wrapper.so（库名不变，Java 代码无需改动）
    externalNativeBuild {
        cmake {
            path new File(qjsDir, 'wrapper-android/src/main/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // quickjs-wrapper 的 Java 层（QuickJSContext / QuickJSLoader 等）直接编进本工程
            java.srcDirs += [
                    new File(qjsDir, 'wrapper-java/src/main/java'),
                    new File(qjsDir, 'wrapper-android/src/main/java'),
            ]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    packagingOptions {
        jniLibs {
            // Android 4.4 的安装器对未压缩/对齐的 so 支持不好，保持旧式打包
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    // ---- 原 player-final 依赖（已在车机验证）----
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'net.jthink:jaudiotagger:2.2.5'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.5'

    // ---- 洛雪音源新增依赖 ----
    // QuickJS：不再用官方 AAR（minSdk 21，在 4.4 上缺 fesetround），改为上面从源码编译
    // Conscrypt：给 Android 4.4 提供新的 TLS 实现（车机上已验证可用）
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    // ExoPlayer 2.18（minSdk 16）：播放在线 HTTPS 音频流
    implementation 'com.google.android.exoplayer:exoplayer-core:2.18.7'
}
